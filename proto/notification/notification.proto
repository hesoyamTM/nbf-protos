syntax = "proto3";

package notification;

option go_package = "notification.v1;notificationv1";

import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc GetNotificationList(GetNotificationListRequest) returns (GetNotificationListResponse);
  rpc GettingNotification(GettingNotificationRequest) returns (stream GettingNotificationResponse);
  rpc ReadNotifications(ReadNotificationsRequest) returns (ReadNotificationsResponse);
}

message Notification {
  string id = 1;
  string title = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
  bool read = 5;
}

message GetNotificationListRequest {
  string user_id = 1;
}

message GetNotificationListResponse {
  repeated Notification notifications = 1;
}

message GettingNotificationRequest {
  string user_id = 1;
  string notification_id = 2;
}

message GettingNotificationResponse {
  Notification notification = 1;
}

message ReadNotificationsRequest {
  repeated string notification_ids = 1;
}

message ReadNotificationsResponse {
 }
